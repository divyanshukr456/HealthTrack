<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · HealthTrack</title>
<meta name="color-scheme" content="light dark">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%230E7C86'/%3E%3Cpath d='M6 17h6l2-5 3 9 2-4h7' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="booting" data-page="dashboard" data-title="Dashboard">
<div class="boot-loader" role="status" aria-label="Loading"><span class="spinner"></span></div>
<main id="content">
  <div class="form-error" id="loadError" role="alert" hidden></div>
  <section class="card hero" aria-label="Today at a glance">
    <div class="hero-copy">
      <h2 id="greeting">&nbsp;</h2>
      <p id="heroLine">Loading your day…</p>
      <div class="quick">
        <a class="btn primary sm" href="daily.html">Log today</a>
        <a class="btn sm" href="workouts.html">Add workout</a>
        <a class="btn sm" href="food.html">Add meal</a>
        <a class="btn sm" href="sleep.html">Add sleep</a>
      </div>
    </div>
    <div class="rings" id="rings"><div class="skel" style="width:100%;height:100%;border-radius:50%"></div></div>
    <ul class="ring-legend" id="ringLegend"></ul>
  </section>
  <section class="tiles" id="tiles" aria-label="Today's metrics"></section>
  <section class="card" aria-labelledby="goalsTitle">
    <div class="card-head"><h2 id="goalsTitle">Active goals</h2><span class="muted" id="goalCount"></span><a href="goals.html" class="btn sm" style="margin-left:auto">Manage goals</a></div>
    <div id="goalsBody"></div>
  </section>
</main>
<noscript><p style="padding:24px">HealthTrack needs JavaScript to run. Please enable it and reload.</p></noscript>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
