<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics · HealthTrack</title>
<meta name="color-scheme" content="light dark">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%230E7C86'/%3E%3Cpath d='M6 17h6l2-5 3 9 2-4h7' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="booting" data-page="analytics" data-title="Analytics">
<div class="boot-loader" role="status" aria-label="Loading"><span class="spinner"></span></div>
<main id="content">
  <div class="card-head" style="margin:0">
    <p class="muted">How your numbers have moved over time.</p>
    <div class="seg" id="range" role="group" aria-label="Date range">
      <button type="button" data-days="7" aria-pressed="true">7 days</button>
      <button type="button" data-days="30" aria-pressed="false">30 days</button>
      <button type="button" data-days="90" aria-pressed="false">90 days</button>
    </div>
  </div>
  <div class="form-error" id="loadError" role="alert" hidden></div>
  <div class="charts" id="chartGrid"></div>
</main>
<noscript><p style="padding:24px">HealthTrack needs JavaScript to run. Please enable it and reload.</p></noscript>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/vendor/chart.umd.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
